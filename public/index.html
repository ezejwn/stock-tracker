<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 주가 & 뉴스 대시보드</title>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 480px; text-align: center; }
    h2 { margin-top: 0; color: #1a1a1a; font-size: 22px; }
    .search-box { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }
    input { width: 60%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
    button { padding: 12px 18px; border: none; background-color: #0066ff; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #0052cc; }
    .price-box { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 12px; }
    .price { font-size: 32px; font-weight: bold; color: #d32f2f; margin: 10px 0; }
    .sub-info { font-size: 14px; color: #666; margin: 5px 0; }
    
    /* 뉴스 섹션 스타일 */
    .news-section { margin-top: 25px; text-align: left; border-top: 1px solid #eee; padding-top: 15px; }
    .news-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 12px; }
    .news-item { padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .news-item:last-child { border-bottom: none; }
    .news-item a { color: #0066ff; text-decoration: none; font-size: 14px; font-weight: 500; display: block; line-height: 1.4; }
    .news-item a:hover { text-decoration: underline; }
    .news-date { font-size: 12px; color: #999; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📈 실시간 주가 & 뉴스 대시보드</h2>
    <div class="search-box">
      <input type="text" id="code" value="005930" placeholder="종목코드 (예: 005930)">
      <button onclick="fetchData()">조회</button>
    </div>

    <!-- 주가 정보 영역 -->
    <div id="result" class="price-box" style="display:none;">
      <div class="sub-info">현재가</div>
      <div class="price" id="currentPrice">0 원</div>
      <div class="sub-info">전일 대비: <span id="diff" style="font-weight:bold;">0</span> 원</div>
      <div class="sub-info">등락률: <span id="rate" style="font-weight:bold;">0</span>%</div>
    </div>

    <!-- 뉴스 정보 영역 -->
    <div id="newsSection" class="news-section" style="display:none;">
      <div class="news-title">📰 관련 뉴스</div>
      <div id="newsList">뉴스를 불러오는 중...</div>
    </div>
  </div>

  <script>
    async function fetchData() {
      const code = document.getElementById('code').value;
      const priceElement = document.getElementById('currentPrice');
      const newsListElement = document.getElementById('newsList');
      
      document.getElementById('result').style.display = 'block';
      document.getElementById('newsSection').style.display = 'block';
      priceElement.innerText = "조회 중...";
      newsListElement.innerHTML = "뉴스를 불러오는 중...";

      // 1. 주가 정보 불러오기
      try {
        const res = await fetch(`/.netlify/functions/stock?code=${code}`);
        const data = await res.json();

        if (data && data.stck_prpr) {
          priceElement.innerText = Number(data.stck_prpr).toLocaleString() + ' 원';
          document.getElementById('diff').innerText = Number(data.prdy_vrss).toLocaleString();
          document.getElementById('rate').innerText = data.prdy_ctrt;
        } else {
          priceElement.innerText = '조회 실패';
        }
      } catch (err) {
        priceElement.innerText = '오류 발생';
      }

      // 2. 네이버 뉴스 불러오기 (종목코드 기반 검색)
      try {
        const newsRes = await fetch(`/.netlify/functions/news?query=${code}`);
        const newsData = await newsRes.json();

        if (Array.isArray(newsData) && newsData.length > 0) {
          newsListElement.innerHTML = newsData.map(item => `
            <div class="news-item">
              <a href="${item.link}" target="_blank">${item.title}</a>
              <div class="news-date">${new Date(item.pubDate).toLocaleDateString('ko-KR')}</div>
            </div>
          `).join('');
        } else {
          newsListElement.innerHTML = "관련 뉴스가 없습니다.";
        }
      } catch (err) {
        newsListElement.innerHTML = "뉴스 로딩 중 오류가 발생했습니다.";
      }
    }
  </script>
</body>
</html>
